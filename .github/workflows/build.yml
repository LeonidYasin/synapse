name: Build Mobile Apps

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build (all/ios/android)'
        required: false
        default: 'all'

jobs:
  build-android:
    if: github.event.inputs.platform == 'all' || github.event.inputs.platform == 'android' || github.event_name == 'push' || github.event_name == 'pull_request'
    uses: ./.github/workflows/android.yml

  build-ios:
    if: github.event.inputs.platform == 'all' || github.event.inputs.platform == 'ios' || github.event_name == 'push' || github.event_name == 'pull_request'
    uses: ./.github/workflows/ios.yml