name: Build Fix

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm install
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build Android
        run: |
          if [ ! -d "android" ]; then
            npx react-native init TempProject --skip-install
            cp -r TempProject/android ./
            rm -rf TempProject
          fi
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm install
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'
      - name: Build iOS
        run: |
          if [ ! -d "ios" ]; then
            npx react-native init TempProject --skip-install
            cp -r TempProject/ios ./
            rm -rf TempProject
          fi
          cd ios
          pod install --repo-update || true
          xcodebuild -workspace synapse.xcworkspace -scheme synapse -configuration Debug -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 15' build || true
      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: ios/build
