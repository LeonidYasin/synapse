name: Build and Package Synapse Mobile App

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get
        working-directory: ./mobile
        continue-on-error: true

      - name: Build Android APK
        run: flutter build apk --release
        working-directory: ./mobile
        continue-on-error: true

      - name: Upload APK (if exists)
        uses: actions/upload-artifact@v4
        with:
          name: synapse-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
        continue-on-error: true

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get
        working-directory: ./mobile
        continue-on-error: true

      - name: Build iOS
        run: flutter build ios --release --no-codesign
        working-directory: ./mobile
        continue-on-error: true

      - name: Upload iOS build (if exists)
        uses: actions/upload-artifact@v4
        with:
          name: synapse-ios-build
          path: mobile/build/ios/iphoneos/Runner.app
        continue-on-error: true