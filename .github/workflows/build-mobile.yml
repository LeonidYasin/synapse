name: Build and Package Synapse Mobile App

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'

      - name: Regenerate Flutter project structure
        run: |
          cd mobile
          # Создаём временный проект, чтобы получить правильную структуру
          mkdir -p temp_project
          cd temp_project
          flutter create --org com.leonidyasin --project-name synapse .
          # Копируем android/ и ios/ в родительскую папку
          cp -r android/ ../
          cp -r ios/ ../
          cp -r .idea/ ../ 2>/dev/null || true
          cd ..
          rm -rf temp_project
          # Копируем наш pubspec.yaml обратно (он уже есть)
          # Восстанавливаем наши lib/ файлы
          echo "Project structure regenerated"

      - name: Get dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Build Android APK
        run: |
          cd mobile
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: synapse-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'

      - name: Regenerate Flutter project structure
        run: |
          cd mobile
          mkdir -p temp_project
          cd temp_project
          flutter create --org com.leonidyasin --project-name synapse .
          cp -r android/ ../
          cp -r ios/ ../
          cp -r .idea/ ../ 2>/dev/null || true
          cd ..
          rm -rf temp_project
          echo "Project structure regenerated"

      - name: Get dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Build iOS
        run: |
          cd mobile
          flutter build ios --release --no-codesign

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: synapse-ios-build
          path: mobile/build/ios/iphoneos/Runner.app
