name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: List available Xcode versions
      run: ls /Applications/ | grep Xcode
    
    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_15.3.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
    
    - name: Install CocoaPods
      run: |
        cd ios
        pod install
    
    - name: Build iOS app
      run: |
        cd ios
        xcodebuild \
          -workspace synapse.xcworkspace \
          -scheme synapse \
          -configuration Debug \
          -sdk iphonesimulator \
          -destination 'platform=iOS Simulator,name=iPhone 15' \
          build
