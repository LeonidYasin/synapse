name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm install
    
    - name: Generate iOS project
      run: |
        if [ ! -d "ios" ]; then
          echo "Creating iOS project using react-native init..."
          npx react-native init TempProject --skip-install
          cp -r TempProject/ios ./
          cp -r TempProject/.gitignore ./
          rm -rf TempProject
        else
          echo "iOS folder exists, updating..."
        fi
    
    - name: Install CocoaPods
      run: |
        cd ios
        pod install --repo-update
    
    - name: Build iOS app
      run: |
        cd ios
        xcodebuild \
          -workspace synapse.xcworkspace \
          -scheme synapse \
          -configuration Debug \
          -sdk iphonesimulator \
          -destination 'platform=iOS Simulator,name=iPhone 15' \
          build
    
    - name: Upload build artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: ios-build
        path: ios/build
