name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm install
    
    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.0'
    
    - name: Install CocoaPods
      run: sudo gem install cocoapods
    
    - name: Generate iOS project
      run: |
        # Создаем временный проект с правильной структурой
        npx react-native init TempProject --skip-install
        
        # Копируем iOS папку целиком
        cp -r TempProject/ios ./
        
        # Копируем конфигурационные файлы
        cp TempProject/package.json ./
        cp TempProject/app.json ./
        cp TempProject/.gitignore ./
        
        # Удаляем временный проект
        rm -rf TempProject
        
        # Проверяем наличие схемы
        echo "=== Проверка схемы ==="
        find ios -name "*.xcscheme" || echo "Схема не найдена"
        
        # Создаем схему, если её нет
        if [ ! -f "ios/synapse.xcodeproj/xcshareddata/xcschemes/synapse.xcscheme" ]; then
          echo "Создаем схему вручную..."
          mkdir -p ios/synapse.xcodeproj/xcshareddata/xcschemes
          cat > ios/synapse.xcodeproj/xcshareddata/xcschemes/synapse.xcscheme << 'EOF'
<?xml version="1.0" encoding="UTF-8"?>
<Scheme
   LastUpgradeVersion = "1500"
   version = "1.3">
   <BuildAction
      parallelizeBuildables = "YES"
      buildImplicitDependencies = "YES">
      <BuildActionEntries>
         <BuildActionEntry
            buildForTesting = "YES"
            buildForRunning = "YES"
            buildForProfiling = "YES"
            buildForArchiving = "YES"
            buildForAnalyzing = "YES">
            <BuildableReference
               BuildableIdentifier = "primary"
               BlueprintIdentifier = "83CBBA2D1A601D0E00E9B192"
               BuildableName = "libsynapse.a"
               BlueprintName = "synapse"
               ReferencedContainer = "container:synapse.xcodeproj">
            </BuildableReference>
         </BuildActionEntry>
      </BuildActionEntries>
   </BuildAction>
   <TestAction
      buildConfiguration = "Debug"
      selectedDebuggerIdentifier = "Xcode.DebuggerFoundation.Debugger.LLDB"
      selectedLauncherIdentifier = "Xcode.DebuggerFoundation.Launcher.LLDB"
      shouldUseLaunchSchemeArgsEnv = "YES">
      <Testables>
      </Testables>
   </TestAction>
   <LaunchAction
      buildConfiguration = "Debug"
      selectedDebuggerIdentifier = "Xcode.DebuggerFoundation.Debugger.LLDB"
      selectedLauncherIdentifier = "Xcode.DebuggerFoundation.Launcher.LLDB"
      launchStyle = "0"
      useCustomWorkingDirectory = "NO"
      ignoresPersistentStateOnLaunch = "NO"
      debugDocumentVersioning = "YES"
      debugServiceExtension = "internal"
      allowLocationSimulation = "YES">
      <BuildableProductRunnable
         runnableDebuggingMode = "0">
         <BuildableReference
            BuildableIdentifier = "primary"
            BlueprintIdentifier = "13B07F8C1A680F5B00A75B9A"
            BuildableName = "synapse.app"
            BlueprintName = "synapse"
            ReferencedContainer = "container:synapse.xcodeproj">
         </BuildableReference>
      </BuildableProductRunnable>
   </LaunchAction>
   <ProfileAction
      buildConfiguration = "Release"
      shouldUseLaunchSchemeArgsEnv = "YES"
      savedToolIdentifier = ""
      useCustomWorkingDirectory = "NO"
      debugDocumentVersioning = "YES">
      <BuildableProductRunnable
         runnableDebuggingMode = "0">
         <BuildableReference
            BuildableIdentifier = "primary"
            BlueprintIdentifier = "13B07F8C1A680F5B00A75B9A"
            BuildableName = "synapse.app"
            BlueprintName = "synapse"
            ReferencedContainer = "container:synapse.xcodeproj">
         </BuildableReference>
      </BuildableProductRunnable>
   </ProfileAction>
   <AnalyzeAction
      buildConfiguration = "Debug">
   </AnalyzeAction>
   <ArchiveAction
      buildConfiguration = "Release"
      revealArchiveInOrganizer = "YES">
   </ArchiveAction>
</Scheme>
EOF
        fi
        
        echo "=== Проверка после создания ==="
        find ios -name "*.xcscheme"
    
    - name: Install Pods
      run: |
        cd ios
        pod install --repo-update
    
    - name: Build iOS app
      run: |
        cd ios
        xcodebuild \
          -workspace synapse.xcworkspace \
          -scheme synapse \
          -configuration Debug \
          -sdk iphonesimulator \
          -destination 'platform=iOS Simulator,name=iPhone 15' \
          build
    
    - name: Upload build artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: ios-build
        path: ios/build
